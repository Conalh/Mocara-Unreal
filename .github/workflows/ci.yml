name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Sidecar/pyproject.toml

      - name: Install sidecar test dependencies
        run: python -m pip install -e "./Sidecar[test]"

      - name: Run portable tests
        run: python -m pytest Tests -q

      - name: Parse Bash scripts
        run: bash -n Scripts/*.sh
