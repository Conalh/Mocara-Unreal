name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Sidecar/pyproject.toml

      - name: Install sidecar test dependencies
        run: python -m pip install -e "./Sidecar[test]"

      - name: Run portable tests
        run: python -m pytest Tests -q

      - name: Parse Bash scripts
        run: bash -n Scripts/*.sh
