name: Feature request
description: Propose a focused Mocara improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Authoring problem
      description: Describe the workflow problem before proposing the implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should the animator be able to accomplish?
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Likely architecture boundary
      options:
        - Unreal authoring UI
        - Sidecar or model runtime
        - HTTP or interchange contract
        - Import or retarget profile
        - Setup or packaging
        - Unsure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: Explain how this should be tested, including viewport acceptance when visual output changes.
